[project]
name = "jobpipe"
version = "0.1.0"
description = "Modular LLM pipeline for multilingual job-postings analysis (ingest, translate, dedup, extract, ESCO/NACE/ISCED normalisation)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Giannis Thivaios" }]
dependencies = [
    "alembic>=1.20.1",
    "emoji>=2.16.0",
    "openai>=3.41.0",
    "opik>=2.2.133",
    "pydantic-settings>=2.4",
    "pymysql>=1.1",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpipe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the MariaDB container running (docker compose up -d db)"]
addopts = "-m 'not db'"
