services:
  db:
    image: mariadb:11.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Runs once, on first start with an empty volume, in alphabetical order
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
      # Maintainer-only (building the sample); empty and unused for everyone else
      - ./dumps:/dumps
      - ./raw_dumps:/raw_dumps:ro
      - ./docker/mariadb/tools:/tools:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db_data:
